name: NAS Terminal relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'terminal-relay/**'
      - 'lib/terminal-protocol.js'
permissions:
  contents: read
concurrency:
  group: nas-terminal-relay-production
  cancel-in-progress: false
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/nas-terminal.test.js tests/terminal-relay-runtime.test.js tests/terminal-ui.test.js tests/duplicates-nas.test.js
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned deploy CLI without credentials
        run: npm install --prefix "$RUNNER_TEMP/terminal-deploy-cli" --ignore-scripts --no-audit --no-fund wrangler@4.156.0
      - name: Validate credential configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TICKET_KEY: ${{ secrets.NAS_TERMINAL_TICKET_KEY }}
          AGENT_KEY: ${{ secrets.NAS_TERMINAL_AGENT_KEY }}
        run: |
          python3 - <<'PY'
          import os,re
          if not os.environ.get('CLOUDFLARE_API_TOKEN'):raise SystemExit('Missing CLOUDFLARE_API_TOKEN secret')
          if not re.fullmatch(r'[a-f0-9]{32}',os.environ.get('CLOUDFLARE_ACCOUNT_ID','')):raise SystemExit('Invalid CLOUDFLARE_ACCOUNT_ID secret')
          raw_ticket,raw_agent=os.environ.get('TICKET_KEY',''),os.environ.get('AGENT_KEY','')
          ticket,agent=raw_ticket.strip(),raw_agent.strip()
          if (raw_ticket and not ticket) or (raw_agent and not agent):raise SystemExit('Terminal keys cannot contain only whitespace')
          if bool(ticket)!=bool(agent):raise SystemExit('Configure both terminal keys together, or neither for initial disabled bootstrap')
          if ticket and (len(ticket)<32 or len(agent)<32 or ticket==agent or any(c.isspace() for c in ticket+agent)):raise SystemExit('Terminal keys must be distinct and at least 32 characters')
          PY
      - name: Deploy relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: node "$RUNNER_TEMP/terminal-deploy-cli/node_modules/wrangler/bin/wrangler.js" deploy --config terminal-relay/wrangler.toml
      - name: Configure terminal keys when provided
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TICKET_KEY: ${{ secrets.NAS_TERMINAL_TICKET_KEY }}
          AGENT_KEY: ${{ secrets.NAS_TERMINAL_AGENT_KEY }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -n "$TICKET_KEY" ]; then
            python3 - <<'PY' | node "$RUNNER_TEMP/terminal-deploy-cli/node_modules/wrangler/bin/wrangler.js" secret bulk --config terminal-relay/wrangler.toml
          import json,os
          print(json.dumps({'TICKET_KEY':os.environ['TICKET_KEY'].strip(),'AGENT_KEY':os.environ['AGENT_KEY'].strip()}))
          PY
          else
            echo 'No terminal keys supplied; existing Worker secrets are preserved. Initial bootstrap remains inaccessible without keys.'
          fi
      - name: Record deployment scope
        run: |
          {
            echo '## NAS Terminal relay'
            echo "Source commit: $GITHUB_SHA"
            echo 'Relay deployed. Homepage activation, NAS agent installation and end-to-end qualification remain separate steps.'
            echo 'No terminal credentials or payloads are included in this summary.'
          } >> "$GITHUB_STEP_SUMMARY"
