name: NAS Terminal qualification once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nas-terminal-qualify-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install verifier dependency without credentials
        run: python3 -m pip install --target "$RUNNER_TEMP/terminal-verify-deps" --disable-pip-version-check websockets==15.0.1
      - name: Audit credential format without printing keys
        env:
          AGENT_KEY: ${{ secrets.NAS_TERMINAL_AGENT_KEY }}
          TICKET_KEY: ${{ secrets.NAS_TERMINAL_TICKET_KEY }}
        run: |
          python3 - <<'PY'
          import os,re
          for name in ("AGENT_KEY","TICKET_KEY"):
              value=os.environ.get(name,"")
              clean=value.strip()
              print(name+"_LENGTH="+str(len(value)))
              print(name+"_EDGE_WHITESPACE="+str(value!=clean))
              print(name+"_URLSAFE_FORMAT="+str(bool(re.fullmatch(r"[A-Za-z0-9_-]{43}",clean))))
          PY
      - name: Verify real relay and NAS using read-only list
        env:
          TICKET_KEY: ${{ secrets.NAS_TERMINAL_TICKET_KEY }}
        run: |
          PYTHONPATH="$RUNNER_TEMP/terminal-verify-deps" python3 - <<'PY'
          import asyncio,base64,hashlib,hmac,json,os,secrets,time,urllib.request,urllib.error
          from websockets.asyncio.client import connect
          base='https://homepage-nas-terminal.thanhhunga4-wtf.workers.dev'
          def enc(b):return base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          key=os.environ['TICKET_KEY'].strip()
          if len(key)<32:raise SystemExit('Missing terminal ticket key')
          async def main():
              claims={'v':1,'aud':'nas-terminal','exp':int(time.time())+180,'cid':secrets.token_hex(16)}
              payload=enc(json.dumps(claims,separators=(',',':')).encode())
              token=payload+'.'+enc(hmac.new(key.encode(),payload.encode(),hashlib.sha256).digest())
              async with connect(base.replace('https:','wss:')+'/connect',origin='https://homepage-nas.vercel.app',open_timeout=20,close_timeout=5,max_size=32768) as ws:
                  await ws.send(json.dumps({'type':'auth','token':token}))
                  m=json.loads(await asyncio.wait_for(ws.recv(),15))
                  if m.get('type')!='ready':raise RuntimeError('Unexpected auth response')
                  print('BROWSER_TICKET_AUTH=PASS',flush=True)
                  if not m.get('online'):
                      print('NAS_AGENT=WAITING',flush=True)
                      until=time.monotonic()+90
                      while time.monotonic()<until:
                          m=json.loads(await asyncio.wait_for(ws.recv(),max(1,until-time.monotonic())))
                          if m.get('type')=='online':break
                      else:raise RuntimeError('NAS agent remained offline')
                  print('NAS_AGENT=ONLINE',flush=True)
                  await ws.send(json.dumps({'type':'command','command':{'op':'list','id':secrets.token_hex(16),'seq':1}}))
                  while True:
                      result=json.loads(await asyncio.wait_for(ws.recv(),15))
                      if result.get('type')=='sessions':
                          count=len(result.get('sessions',[]))
                          if count>3:raise RuntimeError('Session count exceeds policy')
                          print('READONLY_SESSION_LIST=PASS count='+str(count),flush=True)
                          break
                      if result.get('type')=='error':raise RuntimeError('NAS rejected read-only list')
                  if count>=3:raise RuntimeError('No free session for temporary qualification')
                  sid=secrets.token_hex(16)
                  nonce=secrets.token_hex(8)
                  marker=('NAS_TERM_'+nonce).encode()
                  try:
                      await ws.send(json.dumps({'type':'command','command':{'op':'create','id':sid,'seq':2,'cols':80,'rows':24}}))
                      deadline=time.monotonic()+20
                      while True:
                          event=json.loads(await asyncio.wait_for(ws.recv(),max(1,deadline-time.monotonic())))
                          if event.get('type')=='attached' and event.get('id')==sid:break
                          if event.get('type')=='error':raise RuntimeError('Temporary PTY creation failed')
                          if time.monotonic()>deadline:raise RuntimeError('PTY attach timeout')
                      data='printf "NAS_%s\\n" "TERM_'+nonce+'"\r'
                      await ws.send(json.dumps({'type':'command','command':{'op':'input','id':sid,'seq':3,'data':data}}))
                      output=b''
                      deadline=time.monotonic()+20
                      while marker not in output:
                          event=json.loads(await asyncio.wait_for(ws.recv(),max(1,deadline-time.monotonic())))
                          if event.get('type')=='output' and event.get('id')==sid:
                              output=(output+base64.b64decode(event['data']))[-65536:]
                          if event.get('type')=='error':raise RuntimeError('Temporary PTY input failed')
                          if time.monotonic()>deadline:raise RuntimeError('PTY output timeout')
                      print('NAS_PTY_INPUT_OUTPUT=PASS',flush=True)
                  finally:
                      await ws.send(json.dumps({'type':'command','command':{'op':'terminate','id':sid,'seq':4}}))
                      deadline=time.monotonic()+15
                      while True:
                          event=json.loads(await asyncio.wait_for(ws.recv(),max(1,deadline-time.monotonic())))
                          if event.get('type')=='terminated' and event.get('id')==sid:
                              print('TEMPORARY_SESSION_CLOSED=PASS',flush=True)
                              break
                          if event.get('type')=='error' and event.get('seq')==4:raise RuntimeError('Temporary session cleanup not confirmed')
                          if time.monotonic()>deadline:raise RuntimeError('Temporary session cleanup timeout')
              print('Only a temporary owned PTY and printf challenge were used; no other sessions were modified.',flush=True)
          try:asyncio.run(main())
          except Exception as e:
              print('QUALIFICATION=FAIL type='+type(e).__name__,flush=True)
              raise SystemExit(1)
          PY
