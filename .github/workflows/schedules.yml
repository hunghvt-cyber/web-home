name: Schedule inventory
on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/schedules/**, .github/workflows/schedules.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: schedule-inventory
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/schedules/requirements.txt
      - run: python scripts/schedules/collect.py github /tmp/github.json
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish metadata without rebuilding homepage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def call(path, data=None):
              req=urllib.request.Request(base+path,headers=headers,data=json.dumps(data).encode() if data else None,method='PUT' if path.startswith('/contents/') and data else 'POST' if data else 'GET')
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          try: call('/git/ref/heads/reports/schedules')
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
              call('/git/refs',{'ref':'refs/heads/reports/schedules','sha':os.environ['GITHUB_SHA']})
          path='/contents/github.json';sha=None
          try:sha=call(path+'?ref=reports/schedules')['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          data={'message':'Update schedule inventory [skip ci]','branch':'reports/schedules','content':base64.b64encode(open('/tmp/github.json','rb').read()).decode()}
          if sha:data['sha']=sha
          call(path,data)
          PY
