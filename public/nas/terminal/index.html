<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>NAS Terminal</title><link rel="stylesheet" href="/vendor/xterm.css"><link rel="stylesheet" href="/nas-terminal.css"></head>
<body><header><a href="/">← Homepage</a><strong>NAS Terminal</strong><span id="connection" role="status">Chưa kết nối</span><button id="connect" type="button">Kết nối</button><button id="disconnect" type="button" disabled>Ngắt kết nối</button></header>
<section id="unlock-panel"><p id="account-state">Đang kiểm tra đăng nhập…</p><p id="account-message" role="status"></p><a href="/#portal-account">Mở khóa Homepage</a><form id="unlock-form" hidden><label for="terminal-password">Nhập lại mật khẩu Homepage để mở terminal</label><input id="terminal-password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">Mở Terminal</button></form></section>
<nav aria-label="Các phiên terminal"><div id="sessions" role="tablist"></div><button id="new-session" type="button" disabled>＋ Mở phiên</button><button id="refresh" type="button" disabled>Làm mới phiên</button></nav>
<main><div id="empty">Kết nối NAS để mở terminal. Rời trang vẫn giữ các phiên đang chạy.</div><div id="terminal" aria-label="Terminal NAS"></div></main>
<div class="tools"><button id="copy" type="button">Copy màn hình</button><button id="paste" type="button" disabled>Dán</button><button id="ctrl-c" type="button" disabled>Ctrl+C</button><button id="tab-key" type="button" disabled>Tab</button><button id="escape" type="button" disabled>Esc</button><button id="terminate" class="danger" type="button" disabled>Kết thúc phiên</button></div>
<details id="paste-panel"><summary>Dán lệnh nhiều dòng</summary><textarea id="paste-input" rows="4" maxlength="8192" spellcheck="false" placeholder="Dán nội dung tại đây; bấm Gửi để nhập vào terminal."></textarea><button id="send-paste" type="button" disabled>Gửi vào terminal</button></details>
<p id="message" role="status">Tối đa 3 phiên. Ngắt kết nối giữ shell; Kết thúc phiên sẽ dừng shell.</p>
<script src="/vendor/xterm.js" defer></script><script src="/vendor/addon-fit.js" defer></script><script src="/account.js" defer></script><script src="/nas-terminal.js" defer></script></body></html>
